[package]
name = "RustPacker"
version = "2.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4", features = ["derive"] }
path-absolutize = "4"
fs_extra = "1"
path-clean = "1"
rand = "0.10"
libaes = "0.7"
thiserror = "1.0"
anyhow = "1.0"

[profile.release]
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"
lto = true

[package]
name = "rustpacker-core"
version = "3.0.0"
edition = "2021"
authors = ["Nariod"]
description = "Core library for RustPacker - shellcode loader generator"
license = "MIT"

[dependencies]
# Argument parsing
clap = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# File system operations
fs_extra = { workspace = true }
path-clean = { workspace = true }

# Random number generation
rand = { workspace = true }

# Encryption
libaes = { workspace = true }

# String obfuscation
litcrypt = { workspace = true }

# Windows API (for templates)
winapi = { workspace = true }
# WebAssembly (WAT) payload wrapping for the ntWat template
wat = "1.258"

[dev-dependencies]
tempfile = "3"
wasmparser = "0.226"

[package]
name = "rustpacker-templates"
version = "2.0.0"
edition = "2021"
authors = ["Nariod"]
description = "Templates for RustPacker - injection techniques"
license = "MIT"

[dependencies]
rustpacker-core = { path = "../rustpacker-core" }

[profile.release]
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"
lto = true

[package]
name = "ntVEH"
version = "0.1.0"
edition = "2021"
description = "Vectored Exception Handler (VEH) based code injection template"

[workspace]

{{DLL_FORMAT}}

[dependencies]
winapi = { version = "0.3", features = [
    "winuser",
    "winnt", 
    "memoryapi",
    "processthreadsapi",
    "synchapi",
    "errhandlingapi",
    "libloaderapi",
    "ntdef",
    "ntstatus",
    "heapapi"
] }
{{DEPENDENCIES}}

[profile.release]
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"
lto = true
